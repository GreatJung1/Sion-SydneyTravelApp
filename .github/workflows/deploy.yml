# main 브랜치에 올린 Vite 앱을 GitHub Pages에 배포
name: Deploy Sydney Travel App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          # GitHub Pages의 /저장소이름/ 하위 경로에서 JS/CSS가 로딩되도록 설정
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
          
          VITE_TRAVEL_LOGIN_EMAIL: ${{ vars.VITE_TRAVEL_LOGIN_EMAIL }}

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
