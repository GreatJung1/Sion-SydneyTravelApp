<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f4f1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Sydney Test"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><title>Sydney PWA Test</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4f1;color:#252525;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.wrap{max-width:500px;margin:auto;padding:calc(env(safe-area-inset-top) + 34px) 22px calc(env(safe-area-inset-bottom) + 30px)}.eyebrow{font-size:12px;letter-spacing:2px;color:#74746d;font-weight:700}h1{font-size:34px;line-height:1.12;margin:12px 0 10px;letter-spacing:-1.5px}.sub{color:#76766e;font-size:14px;line-height:1.6;margin-bottom:25px}.card{background:white;border-radius:23px;padding:21px;margin:15px 0;box-shadow:0 5px 22px #00000006}.title{font-size:15px;font-weight:750;margin:0 0 13px}label{display:block;color:#777;font-size:12px;margin:12px 0 6px}input{display:block;width:100%;border:1px solid #e4e4e0;background:#fafaf9;border-radius:13px;padding:14px;font:inherit;font-size:16px;color:#222;outline-color:#686e4e}button{width:100%;background:#30322b;color:#fff;border:0;border-radius:14px;padding:15px;font-size:15px;font-weight:700;margin-top:13px;cursor:pointer}.secondary{background:#eef0e9;color:#39402f}.status{font-size:13px;line-height:1.7;color:#62645b}.value{font-size:27px;font-weight:800;letter-spacing:-.7px}.muted{font-size:12px;color:#85857d}.pill{display:inline-block;background:#e7ecde;color:#4e613e;border-radius:99px;padding:7px 11px;font-size:12px;font-weight:700}.entry{border-top:1px solid #eee;padding:13px 0;font-size:14px}.entry small{color:#888;display:block;margin-top:4px}.empty{color:#999;font-size:13px}footer{font-size:11px;color:#999;line-height:1.6;margin-top:22px}</style></head><body><main class="wrap"><div class="eyebrow">SYDNEY · 2026</div><h1>My Travel<br>Test App.</h1><p class="sub">아이폰 설치 · 자동 저장 · 오프라인 실행 테스트</p><span class="pill" id="net">연결 상태 확인 중</span><section class="card"><p class="title">오늘의 테스트 기록</p><label for="memo">메모</label><input id="memo" placeholder="예: 본다이 비치에서 커피" maxlength="120"><label for="amount">금액 (AUD)</label><input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="예: 12.50"><button id="save">아이폰에 기록 저장</button><p class="status" id="message" role="status">저장하면 앱을 종료한 뒤에도 기록을 다시 불러옵니다.</p></section><section class="card"><p class="title">저장된 기록</p><div class="value" id="count">0건</div><div id="entries"></div><button class="secondary" id="export">JSON 백업 파일 내보내기</button></section><section class="card"><p class="title">설치 및 오프라인 상태</p><p class="status" id="mode"></p><p class="status" id="sw"></p></section><footer>이 데모는 기록을 이 기기의 브라우저 저장소(localStorage)에 보관합니다. 앱 삭제·웹사이트 데이터 삭제 시 손실될 수 있으므로 중요한 기록은 백업하세요. 실제 앱에서는 IndexedDB를 사용할 예정입니다.</footer></main><script src="./app.js" defer></script></body></html>
